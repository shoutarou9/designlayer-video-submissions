name: Video submission email

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
    paths:
      - "submissions/**"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Email the maintainers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_NOTIFY_EMAIL: ${{ secrets.CONTACT_NOTIFY_EMAIL }}
          CONTACT_FROM_EMAIL: ${{ secrets.CONTACT_FROM_EMAIL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: node scripts/notify-video-submission.mjs
